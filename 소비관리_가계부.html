<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>소비관리</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#17171a;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}.app{max-width:540px;margin:auto;padding:25px 17px 95px}h1{margin:4px 0 4px;font-size:30px}.sub{color:#777;margin-bottom:20px}.card{background:#fff;border-radius:21px;padding:19px;margin:12px 0;box-shadow:0 2px 12px #0000000b}.hero{background:linear-gradient(135deg,#4338ca,#7c3aed);color:white}.hero h2{font-size:31px;margin:7px 0 17px}.muted{color:#777;font-size:13px}.hero .muted{color:#ddd}.row{display:flex;justify-content:space-between;gap:12px}.big{font-size:20px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{padding:15px;background:#fff;border-radius:18px}.mini b{display:block;font-size:18px;margin-top:6px}.barbg{height:10px;background:#e8e8ed;border-radius:10px;overflow:hidden;margin:10px 0}.bar{height:100%;background:#4f46e5;border-radius:10px}.good{color:#16a34a}.warn{color:#dc2626}.tabs{display:flex;gap:7px;margin:10px 0}.tabs button{flex:1;padding:11px;border:0;border-radius:12px;background:#eee;color:#333;font-weight:700}.tabs .on{background:#4f46e5;color:white}.tx{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.tx:last-child{border:0}.icon{width:40px;height:40px;border-radius:50%;background:#eeeeff;display:grid;place-items:center;margin-right:11px}.txmain{flex:1}.txmain b{display:block}.txmain small{color:#888}.amt{font-weight:800}.income{color:#16a34a}button{font-family:inherit}.add{position:fixed;right:20px;bottom:25px;width:58px;height:58px;border:0;border-radius:50%;background:#4f46e5;color:white;font-size:28px;box-shadow:0 5px 18px #0003}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:flex-end}.sheet{width:100%;max-width:540px;margin:auto;background:#fff;border-radius:24px 24px 0 0;padding:20px;max-height:92vh;overflow:auto}input,select{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin:6px 0 13px}label{font-size:13px;color:#666}.actions{display:flex;gap:8px}.actions button{flex:1;border:0;border-radius:13px;padding:14px;font-size:16px;font-weight:700}.save{background:#4f46e5;color:#fff}.cancel{background:#eee}.link{border:0;background:none;color:#4f46e5;font-weight:700}
</style></head><body><div class="app">
<h1>소비 관리</h1><div class="sub" id="month"></div>
<div class="card hero"><div class="muted">이번 달 소비 가능 금액</div><h2 id="available">₩0</h2><div class="row"><span>월급 <b id="salary">₩0</b></span><span>저축 <b id="saving">₩0</b></span></div></div>
<div class="grid"><div class="mini"><span class="muted">현재까지 사용</span><b id="spent">₩0</b></div><div class="mini"><span class="muted">남은 소비액</span><b id="remain">₩0</b></div></div>
<div class="card"><div class="row"><b>소비 속도</b><b id="status"></b></div><div class="barbg"><div class="bar" id="bar"></div></div><div class="row muted"><span id="daily">하루 평균 ₩0</span><span id="recommended">권장 ₩0/일</span></div><p id="forecast" class="muted" style="margin-bottom:0"></p></div>
<div class="card"><b>카드별 사용</b><div class="grid" style="margin-top:12px"><div class="mini"><span class="muted">💳 신용카드</span><b id="credit">₩0</b></div><div class="mini"><span class="muted">💵 체크카드</span><b id="debit">₩0</b></div></div></div>
<div class="card"><div class="row"><b>이번 달 내역</b><button class="link" onclick="openModal()">＋ 추가</button></div><div class="tabs"><button id="allTab" class="on" onclick="filter='all';render()">전체</button><button id="creditTab" onclick="filter='credit';render()">신용카드</button><button id="debitTab" onclick="filter='debit';render()">체크카드</button></div><div id="list"></div></div>
<div class="card"><div class="row"><b>월급 · 저축 설정</b><button class="link" onclick="openSettings()">수정</button></div><p class="muted" id="settingText"></p></div>
</div><button class="add" onclick="openModal()">＋</button>

<div class="modal" id="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="sheet"><h2>소비 기록</h2><label>금액</label><input id="amount" type="number" inputmode="numeric" placeholder="예: 35000"><label>결제수단</label><select id="method"><option value="credit">신용카드</option><option value="debit">체크카드</option><option value="cash">현금</option></select><label>카테고리</label><select id="cat"><option>식비</option><option>카페</option><option>교통</option><option>쇼핑</option><option>생활</option><option>여가</option><option>뷰티</option><option>구독</option><option>기타</option></select><label>날짜</label><input id="date" type="date"><label>메모</label><input id="memo" placeholder="예: 저녁"><div class="actions"><button class="cancel" onclick="closeModal()">취소</button><button class="save" onclick="saveTx()">저장</button></div></div></div>

<div class="modal" id="settings" onclick="if(event.target.id==='settings')closeSettings()"><div class="sheet"><h2>월급 · 저축 설정</h2><label>월급</label><input id="salaryInput" type="number" inputmode="numeric"><label>매월 저축액</label><input id="savingInput" type="number" inputmode="numeric"><div class="actions"><button class="cancel" onclick="closeSettings()">취소</button><button class="save" onclick="saveSettings()">저장</button></div></div></div>
<script>
let tx=JSON.parse(localStorage.getItem('spendTx')||'[]'), salary=Number(localStorage.getItem('salary')||3000000), saving=Number(localStorage.getItem('saving')||1000000), filter='all';
const won=n=>'₩'+Math.round(n).toLocaleString('ko-KR'); const icons={식비:'🍚',카페:'☕',교통:'🚗',쇼핑:'🛍️',생활:'🏠',여가:'🎮',뷰티:'✨',구독:'🔄',기타:'•'};
function monthTx(){let n=new Date();return tx.filter(x=>{let d=new Date(x.date);return d.getFullYear()==n.getFullYear()&&d.getMonth()==n.getMonth()})}
function render(){
let n=new Date(), cur=monthTx(), available=Math.max(0,salary-saving), spent=cur.reduce((s,x)=>s+x.amount,0), remain=available-spent, day=n.getDate(), days=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(), avg=day?spent/day:0, rec=available/days, projected=avg*days, p=available?Math.min(100,spent/available*100):0;
month.textContent=`${n.getFullYear()}년 ${n.getMonth()+1}월`;document.getElementById('available').textContent=won(available);document.getElementById('salary').textContent=won(salary);document.getElementById('saving').textContent=won(saving);document.getElementById('spent').textContent=won(spent);document.getElementById('remain').textContent=won(remain);
credit.textContent=won(cur.filter(x=>x.method==='credit').reduce((s,x)=>s+x.amount,0));debit.textContent=won(cur.filter(x=>x.method==='debit').reduce((s,x)=>s+x.amount,0));bar.style.width=p+'%';daily.textContent=`하루 평균 ${won(avg)}`;recommended.textContent=`권장 ${won(rec)}/일`;
let st=document.getElementById('status');st.textContent=avg<=rec?'소비 속도 양호':'소비 속도 빠름';st.className=avg<=rec?'good':'warn';forecast.textContent=`현재 속도라면 이번 달 예상 지출은 ${won(projected)}입니다.`;
settingText.textContent=`월급 ${won(salary)} · 저축 ${won(saving)} · 소비 가능 ${won(available)}`;
allTab.className=filter==='all'?'on':'';creditTab.className=filter==='credit'?'on':'';debitTab.className=filter==='debit'?'on':'';
let shown=cur.filter(x=>filter==='all'||x.method===filter).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
list.innerHTML=shown.slice(0,30).map(x=>`<div class="tx"><div class="icon">${icons[x.cat]||'•'}</div><div class="txmain"><b>${x.cat}</b><small>${x.method==='credit'?'신용카드':x.method==='debit'?'체크카드':'현금'}${x.memo?' · '+x.memo:''} · ${x.date.slice(5).replace('-','.')}</small></div><div class="amt">-${won(x.amount)}</div></div>`).join('')||'<div style="padding:18px;text-align:center;color:#888">아직 기록이 없어.</div>';
}
function openModal(){modal.style.display='flex';date.value=new Date().toISOString().slice(0,10);amount.focus()}function closeModal(){modal.style.display='none'}
function saveTx(){let a=Number(amount.value);if(!a)return alert('금액을 입력해줘!');tx.push({id:Date.now(),amount:a,method:method.value,cat:cat.value,date:date.value,memo:memo.value});localStorage.setItem('spendTx',JSON.stringify(tx));amount.value='';memo.value='';closeModal();render()}
function openSettings(){salaryInput.value=salary;savingInput.value=saving;settings.style.display='flex'}function closeSettings(){settings.style.display='none'}function saveSettings(){salary=Number(salaryInput.value)||0;saving=Number(savingInput.value)||0;localStorage.setItem('salary',salary);localStorage.setItem('saving',saving);closeSettings();render()}
render();
</script></body></html>
